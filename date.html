<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期计算</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <meta name="referrer" content="no-referrer">
    <script>
        var _hmt = _hmt || [];
        (function() {
          var hm = document.createElement("script");
          hm.src = "https://hm.baidu.com/hm.js?a7472c1d95356eb90bfb339cd406e69c";
          var s = document.getElementsByTagName("script")[0]; 
          s.parentNode.insertBefore(hm, s);
        })();
        </script>  
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold"><a href="https://www.fixput.com/">FixPut</a></h1>
        <h1 class="text-2xl font-bold mb-4 text-center">日期计算</h1>
        <div class="mb-4">
            <p class="block text-sm font-medium text-gray-700">开始日期</p>
            <div class="flex space-x-2">
                <input type="number" id="startYear" placeholder="年" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <input type="number" id="startMonth" placeholder="月" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <input type="number" id="startDay" placeholder="日" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
        </div>
        <div class="mb-4">
            <p class="block text-sm font-medium text-gray-700">结束日期</p>
            <div class="flex space-x-2">
                <input type="number" id="endYear" placeholder="年" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <input type="number" id="endMonth" placeholder="月" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <input type="number" id="endDay" placeholder="日" class="mt-1 block w-1/3 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
        </div>
        <button id="calculateBtn" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">计算天数差</button>
        <div id="result" class="mt-4 text-center text-lg font-medium"></div>
        <!-- 页脚 -->
    <footer class="text-center">
        <p><a href="https://beian.miit.gov.cn/">京ICP备2024055092号</a> &copy; 2025 保留所有权利</p>
    </footer>
    </div>
    

    <script>
        const startYearInput = document.getElementById('startYear');
        const startMonthInput = document.getElementById('startMonth');
        const startDayInput = document.getElementById('startDay');
        const endYearInput = document.getElementById('endYear');
        const endMonthInput = document.getElementById('endMonth');
        const endDayInput = document.getElementById('endDay');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultDiv = document.getElementById('result');

        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth() + 1;
        const currentDay = currentDate.getDate();

        startYearInput.value = currentYear;
        startMonthInput.value = currentMonth;
        startDayInput.value = currentDay;
        endYearInput.value = currentYear;
        endMonthInput.value = currentMonth;
        endDayInput.value = currentDay;

        calculateBtn.addEventListener('click', () => {
            const startYear = parseInt(startYearInput.value);
            const startMonth = parseInt(startMonthInput.value) - 1;
            const startDay = parseInt(startDayInput.value);
            const endYear = parseInt(endYearInput.value);
            const endMonth = parseInt(endMonthInput.value) - 1;
            const endDay = parseInt(endDayInput.value);

            if (isNaN(startYear) || isNaN(startMonth) || isNaN(startDay) || isNaN(endYear) || isNaN(endMonth) || isNaN(endDay)) {
                resultDiv.textContent = '请输入有效的日期。';
                return;
            }

            const startDate = new Date(startYear, startMonth, startDay);
            const endDate = new Date(endYear, endMonth, endDay);

            if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
                resultDiv.textContent = '请输入有效的日期。';
                return;
            }

            const timeDiff = Math.abs(endDate.getTime() - startDate.getTime());
            const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

            resultDiv.textContent = `两个日期之间相差 ${daysDiff} 天。`;
        });
    </script>
</body>

</html>
