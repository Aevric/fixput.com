<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <!-- 设置字符编码和视口 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 设置页面标题 -->
  <title>Emoji Nice~ 💯</title>
      <link rel="icon" type="image/png" href="favicon.png">
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Font Awesome 图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- 配置 Tailwind 自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            secondary: '#F59E0B',
            dark: '#111827',
            light: '#F9FAFB',
            accent: '#EC4899',
          },
          fontFamily: {
            game: ['"Comic Sans MS"', '"Marker Felt"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- 自定义 Tailwind 样式 -->
  <style type="text/tailwindcss">
    @layer utilities {
      /* 内容自动可见性 */
      .content-auto {
        content-visibility: auto;
      }
      /* emoji 容器样式 */
      .emoji-container {
        transform-origin: center;
        cursor: pointer;
      }
      /* emoji 视觉显示样式 */
      .emoji-visual {
        transform-origin: center;
      }
      /* 脉冲缩放动画 */
      .pulse-scale {
        animation: pulse-scale 0.5s ease-in-out;
      }
      /* 得分弹出动画 */
      .score-popup {
        animation: score-popup 1s ease-out forwards;
      }
      /* 悬停效果 */
      .hover-effect:hover .emoji-visual {
        transform: scale(1.1);
      }
      .hover-effect:hover {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
      }
      /* 滚动后导航栏样式 */
      .nav-scrolled {
        @apply bg-white/95 shadow-lg;
      }
      /* 透明导航栏样式 */
      .nav-transparent {
        @apply bg-white/80 backdrop-blur-sm;
      }
    }

    /* 脉冲缩放动画关键帧 */
    @keyframes pulse-scale {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.5);
      }
      100% {
        transform: scale(0);
      }
    }

    /* 得分弹出动画关键帧 */
    @keyframes score-popup {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-50px);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="overflow-hidden bg-gradient-to-br from-indigo-50 to-purple-100 min-h-screen font-game">
  <!-- 游戏容器 -->
  <div id="game-container" class="relative w-screen h-screen">
    <!-- 导航栏 -->
    <header id="main-header"
      class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 py-3 px-4 md:px-6 flex justify-between items-center nav-transparent">
      <!-- 导航栏左侧内容 -->
      <div class="flex items-center">
        <!-- 游戏图标 -->
        <div class="text-primary mr-2 text-3xl">
          <i class="fa fa-gamepad"></i>
        </div>
        <!-- 游戏标题，点击可跳转至指定网站 -->
        <a href="https://www.fixput.com/">
          <h1 class="text-[clamp(1.2rem,3vw,2rem)] font-bold text-primary">
            Emoji <span class="text-secondary">Check</span>&nbsp;
          </h1>
        </a>
      </div>
      <!-- 导航栏右侧内容 -->
      <div class="flex items-center gap-3 md:gap-6">
        <!-- 得分显示 -->
        <div class="flex items-center bg-white/70 rounded-full px-4 py-2 shadow-md">
          <span class="text-dark mr-2">
            <i class="fa fa-star text-secondary"></i>
          </span>
          <span id="score" class="text-xl font-bold text-primary">0</span>
        </div>
        <!-- 重置按钮 -->
        <button id="reset-btn"
          class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg flex items-center">
          <i class="fa fa-refresh mr-1"></i>
          <span class="hidden sm:inline">重置</span>
        </button>
        <!-- 设置按钮 -->
        <button id="settings-btn"
          class="bg-white/70 hover:bg-white/90 text-primary px-3 py-2 rounded-full transition-all duration-300 transform hover:scale-105 shadow-md">
          <i class="fa fa-cog"></i>
        </button>
      </div>
    </header>
    <!-- 游戏主区域 -->
    <main id="game-area" class="w-full h-full pt-16">
      <!-- Emoji会动态生成在这里 -->
    </main>
    <!-- 游戏说明 -->
    <div class="absolute bottom-4 left-0 right-0 z-50 flex justify-center">
      <div class="bg-white/70 backdrop-blur-sm px-6 py-3 rounded-full text-dark/80 shadow-md">
        <p class="text-[clamp(0.9rem,1.5vw,1.1rem)]">点击Emoji或其周围区域得分，不同表情分值不同！</p>
      </div>
    </div>
    <!-- 设置面板 (默认隐藏) -->
    <div id="settings-panel"
      class="fixed inset-0 z-50 flex items-center justify-center bg-dark/70 backdrop-blur-sm transform translate-y-full transition-transform duration-300">
      <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl transform transition-all duration-300 scale-95 opacity-0"
        id="settings-content">
        <!-- 设置面板标题和关闭按钮 -->
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold text-primary">游戏设置</h2>
          <button id="close-settings" class="text-dark/60 hover:text-dark">
            <i class="fa fa-times text-xl"></i>
          </button>
        </div>
        <!-- 设置项 -->
        <div class="space-y-4">
          <!-- 点击范围设置 -->
          <div>
            <label class="block text-dark font-medium mb-1">点击范围大小</label>
            <input type="range" id="click-range-slider" min="1" max="3" step="0.1" value="1.8"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="flex justify-between text-sm text-dark/60 mt-1">
              <span>小</span>
              <span>中</span>
              <span>大</span>
            </div>
          </div>
          <!-- Emoji生成速度设置 -->
          <div>
            <label class="block text-dark font-medium mb-1">Emoji生成速度</label>
            <input type="range" id="spawn-speed-slider" min="500" max="3000" step="100" value="1500"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="flex justify-between text-sm text-dark/60 mt-1">
              <span>快</span>
              <span>中</span>
              <span>慢</span>
            </div>
          </div>
          <!-- 最大Emoji数量设置 -->
          <div>
            <label class="block text-dark font-medium mb-1">最大Emoji数量</label>
            <input type="range" id="max-emojis-slider" min="5" max="20" step="1" value="10"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="flex justify-between text-sm text-dark/60 mt-1">
              <span>少</span>
              <span>中</span>
              <span>多</span>
            </div>
          </div>
          <!-- 设置操作按钮 -->
          <div class="flex items-center justify-between pt-4 border-t border-gray-200">
            <button id="reset-settings" class="text-primary hover:text-primary/80 font-medium">
              恢复默认
            </button>
            <button id="save-settings"
              class="bg-primary hover:bg-primary/90 text-white px-5 py-2 rounded-full transition-all duration-300 transform hover:scale-105 shadow-md">
              保存设置
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 游戏配置 - 新增点击范围相关配置
    const gameConfig = {
      emojiCount: 5, // 初始显示的emoji数量
      spawnInterval: 1500, // 新emoji生成间隔(ms)
      maxEmojis: 10, // 最大emoji数量
      clickAreaRatio: 1.8, // 点击区域是视觉大小的倍数
      emojiTypes: [
        { char: '😊', points: 10 },
        { char: '😍', points: 15 },
        { char: '😂', points: 12 },
        { char: '🎉', points: 20 },
        { char: '🔥', points: 25 },
        { char: '💎', points: 30 },
        { char: '💩', points: 5 },
        { char: '👻', points: 35 },
        { char: '🦄', points: 40 },
        { char: '💯', points: 50 }
      ]
    };

    // 游戏状态
    let gameState = {
      score: 0,
      emojis: [],
      spawnTimer: null
    };

    // 获取 DOM 元素
    const gameArea = document.getElementById('game-area');
    const scoreElement = document.getElementById('score');
    const resetButton = document.getElementById('reset-btn');
    const header = document.getElementById('main-header');
    const settingsButton = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const settingsContent = document.getElementById('settings-content');
    const closeSettingsButton = document.getElementById('close-settings');
    const clickRangeSlider = document.getElementById('click-range-slider');
    const spawnSpeedSlider = document.getElementById('spawn-speed-slider');
    const maxEmojisSlider = document.getElementById('max-emojis-slider');
    const resetSettingsButton = document.getElementById('reset-settings');
    const saveSettingsButton = document.getElementById('save-settings');

    // 初始化游戏
    function initGame() {
      // 重置游戏状态
      gameState.score = 0;
      gameState.emojis = [];
      scoreElement.textContent = '0';

      // 清空游戏区域
      gameArea.innerHTML = '';

      // 生成初始emoji
      for (let i = 0; i < gameConfig.emojiCount; i++) {
        spawnEmoji();
      }

      // 设置定时生成新emoji
      if (gameState.spawnTimer) clearInterval(gameState.spawnTimer);
      gameState.spawnTimer = setInterval(() => {
        if (gameState.emojis.length < gameConfig.maxEmojis) {
          spawnEmoji();
        }
      }, gameConfig.spawnInterval);
    }

    // 生成一个随机emoji - 优化点击范围
    function spawnEmoji() {
      // 随机选择emoji类型
      const emojiType = gameConfig.emojiTypes[Math.floor(Math.random() * gameConfig.emojiTypes.length)];

      // 获取游戏区域尺寸
      const gameRect = gameArea.getBoundingClientRect();

      // 获取导航栏高度
      const headerHeight = header.offsetHeight;

      // 计算视觉大小和点击区域大小
      const visualSize = Math.floor(Math.random() * 30) + 40; // 视觉大小: 40 - 70px
      const clickAreaSize = visualSize * gameConfig.clickAreaRatio; // 点击区域更大

      // 计算随机位置（考虑点击区域大小和导航栏高度，避免超出屏幕和导航栏）
      const maxX = gameRect.width - clickAreaSize;
      const maxY = gameRect.height - clickAreaSize - headerHeight; // 减去导航栏高度
      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY) + headerHeight; // 从导航栏下方开始

      // 创建emoji容器（点击区域）
      const container = document.createElement('div');
      const emojiId = `emoji-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
      container.id = emojiId;
      container.className = 'emoji-container absolute z-10 transition-all duration-300 hover-effect';
      container.style.left = `${x}px`;
      container.style.top = `${y}px`;
      container.style.width = `${clickAreaSize}px`;
      container.style.height = `${clickAreaSize}px`;
      container.style.display = 'flex';
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      container.style.opacity = '0';

      // 创建视觉显示的emoji
      const emojiElement = document.createElement('div');
      emojiElement.className = 'emoji-visual transition-all duration-300';
      emojiElement.style.fontSize = `${visualSize}px`;
      emojiElement.textContent = emojiType.char;

      // 组合容器和视觉元素
      container.appendChild(emojiElement);
      gameArea.appendChild(container);

      // 淡入动画
      setTimeout(() => {
        container.style.opacity = '1';
      }, 10);

      // 记录emoji信息
      const emojiInfo = {
        id: emojiId,
        element: container,
        visualElement: emojiElement,
        points: emojiType.points,
        type: emojiType.char
      };

      gameState.emojis.push(emojiInfo);

      // 添加点击事件到容器（更大的点击区域）
      container.addEventListener('click', () => handleEmojiClick(emojiInfo));
    }

    // 处理emoji点击
    function handleEmojiClick(emoji) {
      // 增加分数
      gameState.score += emoji.points;
      scoreElement.textContent = gameState.score;

      // 移除emoji
      removeEmoji(emoji.id);

      // 显示得分动画
      showScorePopup(emoji.element, emoji.points);

      // 播放点击动画（视觉元素）
      emoji.visualElement.classList.add('pulse-scale');
    }

    // 显示得分弹窗
    function showScorePopup(element, points) {
      const popup = document.createElement('div');
      popup.className = 'score-popup absolute text-secondary font-bold z-20';
      popup.style.left = `${element.offsetLeft + element.offsetWidth / 2}px`;
      popup.style.top = `${element.offsetTop + element.offsetHeight / 2}px`;
      popup.style.transform = 'translate(-50%, -50%)';
      popup.style.fontSize = `${40}px`;
      popup.textContent = `+${points}`;

      // 根据分数设置不同颜色
      if (points >= 30) {
        popup.classList.add('text-accent');
      }

      gameArea.appendChild(popup);

      // 动画结束后移除
      setTimeout(() => {
        popup.remove();
      }, 1000);
    }

    // 移除emoji
    function removeEmoji(emojiId) {
      // 从状态中移除
      gameState.emojis = gameState.emojis.filter(emoji => emoji.id !== emojiId);

      // 从DOM中移除
      const element = document.getElementById(emojiId);
      if (element) {
        // 先隐藏再移除
        element.style.opacity = '0';
        setTimeout(() => {
          element.remove();
        }, 300);
      }
    }

    // 重置游戏
    function resetGame() {
      // 清除所有emoji
      gameState.emojis.forEach(emoji => {
        emoji.element.remove();
      });

      // 重新初始化
      initGame();
    }

    // 打开设置面板
    function openSettings() {
      // 更新滑块值为当前配置
      clickRangeSlider.value = gameConfig.clickAreaRatio;
      spawnSpeedSlider.value = gameConfig.spawnInterval;
      maxEmojisSlider.value = gameConfig.maxEmojis;

      // 显示设置面板
      settingsPanel.classList.remove('translate-y-full');
      setTimeout(() => {
        settingsContent.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    // 关闭设置面板
    function closeSettings() {
      settingsContent.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        settingsPanel.classList.add('translate-y-full');
      }, 300);
    }

    // 保存设置
    function saveSettings() {
      // 更新游戏配置
      gameConfig.clickAreaRatio = parseFloat(clickRangeSlider.value);
      gameConfig.spawnInterval = parseInt(spawnSpeedSlider.value);
      gameConfig.maxEmojis = parseInt(maxEmojisSlider.value);

      // 重新初始化游戏以应用新设置
      resetGame();

      // 关闭设置面板
      closeSettings();
    }

    // 恢复默认设置
    function resetSettings() {
      clickRangeSlider.value = 1.8;
      spawnSpeedSlider.value = 1500;
      maxEmojisSlider.value = 10;
    }

    // 监听滚动事件，改变导航栏样式
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) {
        header.classList.remove('nav-transparent');
        header.classList.add('nav-scrolled');
      } else {
        header.classList.remove('nav-scrolled');
        header.classList.add('nav-transparent');
      }
    });

    // 事件监听
    resetButton.addEventListener('click', resetGame);
    settingsButton.addEventListener('click', openSettings);
    closeSettingsButton.addEventListener('click', closeSettings);
    saveSettingsButton.addEventListener('click', saveSettings);
    resetSettingsButton.addEventListener('click', resetSettings);

    // 窗口大小变化时重新布局
    window.addEventListener('resize', () => {
      // 移除所有可能超出屏幕的emoji
      const gameRect = gameArea.getBoundingClientRect();
      gameState.emojis.forEach(emoji => {
        const rect = emoji.element.getBoundingClientRect();
        if (rect.right > gameRect.right || rect.bottom > gameRect.bottom) {
          removeEmoji(emoji.id);
        }
      });
    });

    // 启动游戏
    initGame();
  </script>
</body>

</html>
