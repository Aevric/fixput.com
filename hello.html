<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<link rel="icon" type="image/png" href="https://www.fixput.com/favicon.png">
		<title>Fix-Put</title>
		<link rel="stylesheet" href="styles/main.css">
	</head>
	<body>
		<!-- 初始侧元素（小鱼canvas + 文字） -->
		<canvas id="fishes" class="toggle-item show"></canvas>
		<div id="initial" class="toggle-item show">我的小鱼🐟 · 你醒了吗 😴</div>

		<!-- 目标侧仅保留渐变色块容器（移除原target文字div） -->
		<div id="target-related" class="toggle-item hide gradient-blocks-wrap">
			<div class="color-blocks">
				<div class="color-block red" data-gradient="url(./imgs/eYClI7.png)"></div>
				<div class="color-block green" data-gradient="linear-gradient(135deg, #88d8b0 0%, #70c498 100%)"></div>
				<div class="color-block blue" data-gradient="linear-gradient(135deg, #94b9e3 0%, #7da4d0 100%)"></div>
				<div class="color-block yellow" data-gradient="linear-gradient(135deg, #ffe488 0%, #f9d266 100%)"></div>
			</div>
		</div>

		<!-- JS引入顺序不变 -->
		<script src="scripts/fish-animation.js"></script>
		<script src="scripts/toggle-content.js"></script>
		<script src="scripts/gradient-switch.js"></script>
	</body>
</html>
