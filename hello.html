  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const links = document.querySelectorAll('.device-redirect');
      links.forEach(link => {
        link.addEventListener('click', function () {
          const baseHref = this.getAttribute('data-base-href');
          redirectBasedOnDevice(baseHref);
        });
      });
    });

    function redirectBasedOnDevice(baseHref) {
      const userAgent = navigator.userAgent.toLowerCase();
      const isMobile = /mobile|android|iphone|ipad|ipod/i.test(userAgent);
      const extension = isMobile ? '_m.html' : '.html';

      window.location.href = baseHref + extension;
    }
  </script>

  <script>
    // 优化惊喜元素的JavaScript，减少DOM操作
    document.addEventListener('DOMContentLoaded', () => {
      const icons = document.querySelectorAll('#surprise-icons i');
      let animationActive = false;
      
      // 优化随机显示函数，减少重绘
      function showRandomIcon() {
        if (animationActive) return;
        
        animationActive = true;
        const randomIndex = Math.floor(Math.random() * icons.length);
        const icon = icons[randomIndex];
        
        // 重置状态
        icon.style.opacity = '0';
        icon.style.transition = 'none';
        
        // 随机位置
        const top = Math.floor(Math.random() * 80) + 10;
        const left = Math.floor(Math.random() * 80) + 10;
        icon.style.top = `${top}%`;
        icon.style.left = `${left}%`;
        
        // 触发重排后再应用过渡
        void icon.offsetWidth;
        
        // 淡入淡出动画
        icon.style.transition = 'opacity 0.5s ease-in-out';
        icon.style.opacity = '0.7';
        
        setTimeout(() => {
          icon.style.opacity = '0';
          setTimeout(() => {
            animationActive = false;
          }, 500);
        }, 2000);
      }
      
      // 延长动画间隔，减少CPU使用
      setInterval(showRandomIcon, 8000);
      
      // 初始显示一个
      setTimeout(showRandomIcon, 1500);
      
      // 双击标题区的惊喜效果 - 添加节流控制
      const header = document.querySelector('header');
      let lastClick = 0;
      
      header.addEventListener('dblclick', () => {
        const now = Date.now();
        if (now - lastClick < 1500) return; // 防止过快连续点击
        lastClick = now;
        
        icons.forEach((icon, index) => {
          setTimeout(() => {
            icon.style.opacity = '0.8';
            icon.style.transition = 'opacity 0.3s ease-in-out';
            
            setTimeout(() => {
              icon.style.opacity = '0';
            }, 800);
          }, index * 200);
        });
      });
    });
  </script>
